<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>আমার পরিবার</title>
<style>
:root{
  --navy:#1e3a8a; --green:#16a34a; --red:#dc2626; --sky:#0ea5e9;
  --purple:#7c3aed; --orange:#f97316;
  --bg:#f3f6fb; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --radius:16px;
}
html.dark{
  --bg:#0b1220; --card:#131d2f; --text:#e6edf7; --muted:#94a3b8; --line:#1e2b42;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri","Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding-bottom:86px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:.4em 0}
.hidden{display:none !important}

/* splash */
.splash{position:fixed;inset:0;background:linear-gradient(160deg,#1e3a8a,#16a34a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;padding:20px}
.splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{font-size:72px;animation:pop .8s ease-out}
.splash h1{font-size:30px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* layout */
.page{padding:14px 14px 20px;max-width:720px;margin:0 auto}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.page-head h2{flex:1;font-size:20px}
.icon-btn{border:0;background:var(--card);border-radius:12px;width:40px;height:40px;cursor:pointer;font-size:18px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 2px 10px rgba(15,23,42,.06);margin-bottom:12px}
.hero{background:linear-gradient(120deg,#dbeafe,#dcfce7);color:#0f172a;border-radius:var(--radius);padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
html.dark .hero{background:linear-gradient(120deg,#1e3a8a,#14532d);color:#fff}
.hero p{margin:0;font-size:14px}
.hero h2{margin:4px 0;font-size:22px}
.hero .hero-art{font-size:44px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{border-radius:var(--radius);padding:12px;color:#fff;min-height:88px}
.stat small{opacity:.9;display:block}
.stat b{font-size:19px;display:block;margin-top:6px}
.stat .sub{font-size:11px;opacity:.85}
.c-bal{background:linear-gradient(135deg,#16a34a,#15803d)}
.c-inc{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.c-exp{background:linear-gradient(135deg,#ef4444,#dc2626)}
.c-sav{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}

/* chart + savings */
.chart-wrap{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center}
.chart{width:100%;height:130px}
.chart polyline{fill:none;stroke-width:2.5;stroke-linejoin:round}
.line-inc{stroke:var(--green)} .line-exp{stroke:var(--red)}
.rate{background:#dcfce7;color:#14532d;border-radius:14px;padding:10px;text-align:center}
html.dark .rate{background:#14532d;color:#dcfce7}
.rate b{font-size:22px;display:block}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;margin-bottom:4px;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.dot.g{background:var(--green)} .dot.r{background:var(--red)}

/* family strip */
.family{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.av{width:38px;height:38px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.av.more{background:var(--muted)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.tile{border:0;border-radius:var(--radius);padding:10px 8px 12px;background:var(--card);box-shadow:0 2px 10px rgba(15,23,42,.06);cursor:pointer;text-align:center;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile-art{position:relative;height:112px;display:grid;place-items:center;margin-bottom:6px;overflow:hidden;border-radius:12px}
.tile-art span{font-size:52px}
.tile-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tile b{font-size:14px}

/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(15,23,42,.08);z-index:20}
.bottomnav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:20px;cursor:pointer;color:var(--muted);min-width:56px}
.bottomnav button small{font-size:11px}
.bottomnav button.active{color:var(--navy);font-weight:700}
.bottomnav .fab{width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;font-size:34px;margin-top:-26px;box-shadow:0 6px 16px rgba(22,163,74,.4);justify-content:center}
.badge{position:absolute;top:-2px;right:6px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;font-style:normal}

/* forms & buttons */
.form label{display:block;font-size:14px;margin-bottom:10px}
.form input,.form select{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--line);cursor:pointer;font-weight:600}
.btn.primary{background:var(--navy);color:#fff}
.btn.income{background:var(--green);color:#fff}
.btn.expense{background:var(--red);color:#fff}
.btn.savings{background:var(--purple);color:#fff}
.btn.block{display:block;width:100%;margin:8px 0}
.link{border:0;background:none;color:var(--navy);cursor:pointer;padding:10px;font-weight:600;display:block;margin:0 auto}
.mini{border:0;background:var(--line);border-radius:10px;padding:6px 9px;cursor:pointer}
.mini.danger{background:#fee2e2}
.inline{display:flex;gap:6px;margin-top:6px}
.inline input{flex:1;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.acts{display:flex;gap:6px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.chip{border:0;border-radius:20px;padding:7px 14px;background:var(--card);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff}

/* lists */
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.col{flex-direction:column;align-items:stretch}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grow{flex:1;display:flex;flex-direction:column}
.grow small,.row small{color:var(--muted);font-size:12px}
.amt{font-weight:700;white-space:nowrap}
.amt.income{color:var(--green)} .amt.expense{color:var(--red)} .amt.savings{color:var(--purple)}
.tag{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--line)}
.tag.borrow{background:#fee2e2}.tag.lend{background:#dcfce7}
.empty{color:var(--muted);text-align:center;padding:20px}
.warn{color:var(--orange);font-weight:600}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--green);transition:width .5s}
.bar i.hi{background:var(--orange)} .bar i.over{background:var(--red)}
h4{margin-top:14px;color:var(--navy)}

/* report */
.bars{display:flex;align-items:flex-end;gap:4px;height:160px;overflow-x:auto;padding:8px 0;margin-bottom:6px}
.col-bar{display:flex;flex-direction:column;align-items:center;min-width:18px;height:100%;justify-content:flex-end}
.pair{display:flex;align-items:flex-end;gap:2px;height:130px}
.pair i{display:block;width:8px;border-radius:4px 4px 0 0}
.bi{background:var(--green)} .be{background:var(--red)}
.col-bar small{font-size:10px;color:var(--muted)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary div{background:var(--bg);border-radius:12px;padding:10px}
.summary small{color:var(--muted);display:block}

/* overlay & toast */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.overlay-box{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:360px;text-align:center}
.wel .coin{font-size:64px;animation:spin 1.2s ease-in-out infinite alternate}
.wel .bars{display:flex;justify-content:center;align-items:flex-end;gap:8px;height:70px;margin:10px 0}
.wel .bars i{width:16px;background:var(--green);border-radius:6px;animation:grow 1.4s ease-in-out infinite alternate}
.wel .bars i:nth-child(2){animation-delay:.2s}.wel .bars i:nth-child(3){animation-delay:.4s}.wel .bars i:nth-child(4){animation-delay:.6s}
.wel.still .coin,.wel.still .bars i{animation:none}
.wel .quote{color:var(--muted);font-style:italic}
@keyframes spin{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
@keyframes grow{from{height:20%}to{height:100%}}
body.no-anim *{animation:none !important;transition:none !important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;max-width:90%;text-align:center}
.toast.err{background:var(--red)}

/* auth & welcome */
.auth-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;max-width:420px;margin:0 auto}
.auth-page .hero-art{font-size:72px}
.auth-page .btn{width:100%;margin-top:10px}
.auth-page form{text-align:left;width:100%}
.lang{display:flex;gap:6px;justify-content:center;margin-top:14px}
.lang button{border:0;border-radius:12px;padding:6px 12px;background:var(--card);cursor:pointer}
.lang button.on{background:var(--navy);color:#fff}

/* settings */
.profile{display:flex;align-items:center;gap:12px;cursor:pointer}
.profile .av{width:52px;height:52px;font-size:22px}
.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.switch{width:46px;height:26px;border-radius:14px;background:var(--line);position:relative;border:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--green)}
.switch.on::after{left:23px}

/* ================= Premium motion layer ================= */
:root{
  --ease-out:cubic-bezier(.2,.75,.25,1);
  --ease-spring:cubic-bezier(.2,.85,.25,1.18);
  --motion-fast:180ms;
  --motion-mid:320ms;
  --motion-slow:480ms;
}
html{scroll-behavior:smooth}
body{
  background-image:radial-gradient(ellipse at 8% 0%,rgba(14,165,233,.055),transparent 38%),
                   radial-gradient(ellipse at 100% 28%,rgba(22,163,74,.045),transparent 34%);
  -webkit-tap-highlight-color:transparent;
}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid rgba(14,165,233,.28);outline-offset:2px
}
.splash{
  background:
    radial-gradient(circle at 18% 18%,rgba(255,255,255,.16),transparent 28%),
    radial-gradient(circle at 85% 78%,rgba(255,255,255,.12),transparent 26%),
    linear-gradient(145deg,#1e3a8a 0%,#166534 100%);
  transition:opacity .48s var(--ease-out),visibility .48s;
  overflow:hidden;
}
.splash::before,.splash::after{
  content:"";position:absolute;border:1px solid rgba(255,255,255,.13);
  border-radius:50%;pointer-events:none
}
.splash::before{width:250px;height:250px;animation:splashOrbit 12s linear infinite}
.splash::after{width:340px;height:340px;animation:splashOrbit 18s linear infinite reverse}
.splash.gone{display:flex;opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{filter:drop-shadow(0 10px 20px rgba(0,0,0,.18));animation:logoArrive .85s var(--ease-spring) both}
.splash h1{opacity:0;animation:textArrive .65s .22s var(--ease-out) forwards}
.splash p{opacity:0;animation:textArrive .65s .38s var(--ease-out) forwards}
.splash small{opacity:.72;letter-spacing:.12em;margin-top:16px}
@keyframes splashOrbit{to{transform:rotate(360deg)}}
@keyframes logoArrive{0%{transform:translateY(14px) scale(.62);opacity:0}70%{transform:translateY(-3px) scale(1.06)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes textArrive{from{transform:translateY(9px);opacity:0}to{transform:translateY(0);opacity:1}}
#main{min-height:60vh}
.page,.auth-page{animation:pageArrive .38s var(--ease-out) both;will-change:opacity,transform}
@keyframes pageArrive{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.page-head{animation:pageArrive .35s var(--ease-out) both}
.hero{box-shadow:0 8px 24px rgba(30,58,138,.08);animation:pageArrive .42s var(--ease-out) both}
.card,.stat,.tile,.auth-page>.btn,.auth-page>.card{
  animation:cardArrive .42s var(--ease-out) both;
}
.card:nth-child(2),.stat:nth-child(2),.tile:nth-child(2){animation-delay:35ms}
.card:nth-child(3),.stat:nth-child(3),.tile:nth-child(3){animation-delay:70ms}
.card:nth-child(4),.stat:nth-child(4),.tile:nth-child(4){animation-delay:105ms}
.tile:nth-child(5){animation-delay:140ms}.tile:nth-child(6){animation-delay:175ms}
.tile:nth-child(7){animation-delay:210ms}.tile:nth-child(8){animation-delay:245ms}
@keyframes cardArrive{from{opacity:0;transform:translate3d(0,14px,0) scale(.985)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
.card{
  border:1px solid rgba(148,163,184,.10);
  box-shadow:0 3px 14px rgba(15,23,42,.045),0 1px 2px rgba(15,23,42,.025);
  transition:box-shadow .25s var(--ease-out),transform .25s var(--ease-out),border-color .25s;
}
.tile{
  position:relative;overflow:hidden;
  border:1px solid rgba(148,163,184,.12);
  box-shadow:0 4px 14px rgba(15,23,42,.055),0 1px 2px rgba(15,23,42,.025);
  transition:transform .22s var(--ease-out),box-shadow .22s var(--ease-out),border-color .22s;
  transform:translateZ(0);
}
.tile::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 42%);
  opacity:.55;pointer-events:none
}
.tile:active,.btn:active,.icon-btn:active,.mini:active,.chip:active,.bottomnav button:active{
  transform:scale(.965);transition-duration:90ms
}
.tile:hover{box-shadow:0 10px 24px rgba(15,23,42,.10);border-color:rgba(14,165,233,.2)}
.tile-art img{filter:drop-shadow(0 5px 7px rgba(15,23,42,.08));transition:transform .35s var(--ease-out)}
.tile:hover .tile-art img{transform:translateY(-3px) scale(1.035)}
.tile-art span{transition:transform .35s var(--ease-spring)}
.tile:hover .tile-art span{transform:translateY(-3px) rotate(-3deg)}
.stat{box-shadow:0 6px 16px rgba(15,23,42,.08);transition:transform .25s,filter .25s}
.stat:active{transform:scale(.985)}
.form input,.form select,.inline input{
  transition:border-color .2s,box-shadow .2s,background-color .2s;
}
.form input:focus,.form select:focus,.inline input:focus{
  outline:none;border-color:var(--sky);
  box-shadow:0 0 0 3px rgba(14,165,233,.12);
  background:var(--card);
}
.btn,.mini,.icon-btn,.chip,.link,.bottomnav button,.switch,.lang button{
  transition:transform .18s var(--ease-out),box-shadow .2s,background-color .2s,color .2s,filter .2s;
}
.btn{box-shadow:0 2px 5px rgba(15,23,42,.045)}
.btn.primary,.btn.income,.btn.expense,.btn.savings{box-shadow:0 5px 13px rgba(15,23,42,.12)}
.btn:active{filter:brightness(.96)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none}
.chip{border:1px solid transparent}
.chip.on{box-shadow:0 4px 10px rgba(30,58,138,.16)}
.row{animation:rowArrive .32s var(--ease-out) both}
@keyframes rowArrive{from{opacity:0;transform:translateX(7px)}to{opacity:1;transform:translateX(0)}}
.bar i{transform-origin:left center;animation:barGrow .7s .08s var(--ease-out) both}
@keyframes barGrow{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.pair i{transform-origin:bottom;animation:barRise .65s var(--ease-out) both}
@keyframes barRise{from{transform:scaleY(.03);opacity:.5}to{transform:scaleY(1);opacity:1}}
.chart polyline{stroke-dasharray:520;stroke-dashoffset:520;animation:drawLine 1.1s .12s var(--ease-out) forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
.bottomnav{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(148,163,184,.12)}
.bottomnav button.active::before{
  content:"";position:absolute;top:-7px;width:22px;height:3px;border-radius:4px;background:var(--navy);
  animation:navMark .22s var(--ease-out) both
}
@keyframes navMark{from{transform:scaleX(.25);opacity:0}to{transform:scaleX(1);opacity:1}}
.bottomnav .fab{transition:transform .2s var(--ease-spring),box-shadow .2s}
.bottomnav .fab:active{transform:scale(.92) translateY(1px)}
.switch::after{transition:left .22s var(--ease-spring),transform .22s}
.switch:active::after{transform:scale(.9)}
.overlay{
  opacity:0;transition:opacity .22s var(--ease-out);
  overflow-y:auto;overscroll-behavior:contain
}
.overlay:not(.hidden){opacity:1}
.overlay-box{
  max-height:min(86vh,720px);overflow-y:auto;
  box-shadow:0 22px 70px rgba(0,0,0,.22);
  animation:modalArrive .26s var(--ease-spring) both;
}
@keyframes modalArrive{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.overlay.is-closing{opacity:0}.overlay.is-closing .overlay-box{animation:modalExit .17s var(--ease-out) both}
@keyframes modalExit{to{opacity:0;transform:translateY(6px) scale(.97)}}
.toast{box-shadow:0 8px 24px rgba(15,23,42,.22);animation:toastArrive .24s var(--ease-spring) both}
@keyframes toastArrive{from{opacity:0;transform:translate(-50%,12px) scale(.97)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.form.is-busy .btn[type=submit]{opacity:.78;pointer-events:none}
.form.is-busy .btn[type=submit]::after{content:"";display:inline-block;width:13px;height:13px;margin-left:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spinLoader .65s linear infinite}
@keyframes spinLoader{to{transform:rotate(360deg)}}
.field-error{border-color:var(--red)!important;animation:fieldShake .28s ease}
@keyframes fieldShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
html.dark .card,html.dark .tile{border-color:rgba(148,163,184,.08);box-shadow:0 4px 16px rgba(0,0,0,.14)}
html.dark .form input:focus,html.dark .form select:focus{background:#17243a}
@media(hover:hover) and (pointer:fine){
  .tile:hover{transform:translateY(-3px)}
  .card:hover{box-shadow:0 7px 20px rgba(15,23,42,.065)}
}
@media(max-width:380px){
  .page{padding-left:10px;padding-right:10px}
  .tiles{gap:9px}
  .tile-art{height:96px}
  .tile-art span{font-size:46px}
  .stat{padding:10px;min-height:82px}
  .stat b{font-size:17px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

.tap-press{transform:scale(.965)!important;filter:brightness(.98)}
/* Google sign-in */
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f2937;border:1px solid var(--line);box-shadow:0 2px 8px rgba(15,23,42,.08)}
.google-btn:active{transform:scale(.97)}
.g-logo{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);color:#fff;font-size:13px;font-weight:800}
.or-line{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:13px;width:100%}
.or-line::before,.or-line::after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>

<div id="splash" class="splash">
  <div class="splash-logo">🏠</div>
  <h1 id="splash-name"></h1>
  <p id="splash-tag"></p>
  <small>v1.0.0</small>
</div>
<div id="overlay" class="overlay hidden"><div id="overlay-box" class="overlay-box"></div></div>
<div id="toast" class="toast hidden"></div>
<main id="main"></main>
<nav id="bottomnav" class="bottomnav hidden"></nav>

<script>
/* ================= ভাষা ও লেখা ================= */

/* ================= লোকাল ডেটা ================= */
const DB = {
  KEY: 'amar_poribar_v1',
  defaults() {
    return {
      users: [], session: null, store: {}, quoteIndex: -1,
      settings: { lang: 'bn', theme: 'light', animations: true, notifications: true, profileOpen: false }
    };
  },
  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (!raw) return this.defaults();
      const d = JSON.parse(raw);
      const base = this.defaults();
      return Object.assign(base, d, { settings: Object.assign(base.settings, d.settings || {}) });
    } catch (e) { return this.defaults(); }
  },
  save(d) {
    try { localStorage.setItem(this.KEY, JSON.stringify(d)); }
    catch (e) { console.warn('সংরক্ষণ ব্যর্থ', e); }
  },
  uid() {
    return (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  },
  newBucket() {
    return {
      records: [], budgets: [], members: [], loans: [],
      accounts: [
        { id: 'cash', builtin: true }, { id: 'bkash', builtin: true }, { id: 'nagad', builtin: true },
        { id: 'rocket', builtin: true }, { id: 'bank', builtin: true }
      ],
      cats: {
        income: ['sal', 'biz', 'bonus', 'oth_inc'],
        expense: ['market', 'rent', 'transport', 'food', 'medical', 'edu', 'electricity', 'mobile', 'oth_exp'],
        savings: ['sv_future', 'sv_medical', 'sv_edu', 'sv_home', 'sv_emergency']
      }
    };
  }
};

/* ক্লাউড (Firebase) এখনো যুক্ত হয়নি; কনফিগ পেলে এখানে যুক্ত হবে */
const CLOUD = { enabled: false, async init() { return false; }, status() { return 'local'; } };

/* ================= অ্যাপ ================= */
(function () {
  'use strict';

  const S = { data: DB.load(), view: 'home', params: {}, filter: 'all', period: 'monthly', authMode: 'login' };

  const L = () => S.data.settings.lang;
  const t = k => { const x = T[k]; return x ? (x[L()] || x.en) : k; };
  const tf = (k, v) => t(k).replace(/\{(\w+)\}/g, (_, x) => v[x]);
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dg = s => L() === 'bn' ? String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]) : String(s);
  const money = n => '৳ ' + dg(Math.round(Number(n) || 0).toLocaleString('en-US'));
  function animateVisibleNumbers() {
    const nodes = document.querySelectorAll('[data-countup]');
    nodes.forEach(node => {
      const target = Number(node.dataset.countup);
      if (!Number.isFinite(target) || target < 0) return;
      const duration = (!S.data.settings.animations || window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 0 : 620;
      const start = performance.now();
      const tick = now => {
        const p = duration ? Math.min(1, (now - start) / duration) : 1;
        const eased = 1 - Math.pow(1 - p, 3);
        node.textContent = money(target * eased);
        if (p < 1 && node.isConnected) requestAnimationFrame(tick);
      };
      node.textContent = money(0);
      requestAnimationFrame(tick);
    });
  }

  const pct = n => dg(Math.round(n)) + '%';
  const persist = () => DB.save(S.data);
  const U = () => S.data.store[S.data.session.id];

  const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const today = () => iso(new Date());
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  const monthEnd = s => iso(new Date(+s.slice(0, 4), +s.slice(5, 7), 0));
  const fmtDate = s => { const [y, m, d] = s.split('-'); return dg(`${d}/${m}/${y}`); };

  const catName = k => T['cat_' + k] ? t('cat_' + k) : k;
  const accName = a => a.builtin ? t('acc_' + a.id) : a.name;
  const accById = id => U().accounts.find(a => a.id === id);
  const accLabel = id => { const a = accById(id); return a ? accName(a) : ''; };
  const memById = id => U().members.find(m => m.id === id);
  const memName = id => { const m = memById(id); return m ? m.name : ''; };

  const recs = (type, from, to) => U().records.filter(r => r.type === type && (!from || r.date >= from) && (!to || r.date <= to));
  const sumOf = (type, from, to, cat) => recs(type, from, to).filter(r => !cat || r.category === cat).reduce((a, r) => a + Number(r.amount), 0);
  const accBal = a => (a.opening || 0) + U().records.filter(r => r.account === a.id)
    .reduce((s, r) => s + (r.type === 'income' ? Number(r.amount) : -Number(r.amount)), 0);

  function rangeOf(p) {
    const n = today();
    if (p === 'daily') return [n, n];
    if (p === 'weekly') return [addDays(n, -6), n];
    if (p === 'yearly') return [n.slice(0, 4) + '-01-01', n];
    return [n.slice(0, 8) + '01', n];
  }

  function buckets(p) {
    const n = today(), out = [];
    if (p === 'daily') return [{ l: fmtDate(n), f: n, t: n }];
    if (p === 'weekly') {
      for (let i = 6; i >= 0; i--) { const d = addDays(n, -i); out.push({ l: dg(d.slice(8)), f: d, t: d }); }
      return out;
    }
    if (p === 'monthly') {
      const y = n.slice(0, 4), m = n.slice(5, 7), last = +n.slice(8);
      for (let d = 1; d <= last; d++) {
        const s = `${y}-${m}-${String(d).padStart(2, '0')}`;
        out.push({ l: dg(d), f: s, t: s });
      }
      return out;
    }
    const y = n.slice(0, 4), cm = +n.slice(5, 7);
    for (let m = 1; m <= cm; m++) {
      const f = `${y}-${String(m).padStart(2, '0')}-01`, end = monthEnd(f);
      out.push({ l: dg(m), f, t: end < n ? end : n });
    }
    return out;
  }

  function budgetMsg(p) {
    if (p >= 100) return t('over');
    if (p >= 90) return t('warn90');
    if (p >= 75) return t('warn75');
    if (p >= 50) return t('warn50');
    return '';
  }

  function alerts() {
    if (!S.data.settings.notifications || !S.data.session) return [];
    return U().budgets.map(b => {
      const sp = sumOf('expense', b.from, b.to, b.category);
      const p = b.amount ? sp / b.amount * 100 : 0;
      const msg = budgetMsg(p);
      return msg ? { name: b.name, text: msg } : null;
    }).filter(Boolean);
  }

  /* ---------- ওভারলে, টোস্ট, সেটিংস ---------- */
  function openOverlay(html) {
    const overlay = $('#overlay');
    $('#overlay-box').innerHTML = html;
    overlay.classList.remove('hidden', 'is-closing');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('role', 'dialog');
  }
  function closeOverlay() {
    const overlay = $('#overlay');
    if (overlay.classList.contains('hidden')) return;
    overlay.classList.add('is-closing');
    overlay.removeAttribute('aria-modal');
    overlay.removeAttribute('role');
    setTimeout(() => {
      if (!overlay.classList.contains('is-closing')) return;
      overlay.classList.add('hidden');
      overlay.classList.remove('is-closing');
    }, 190);
  }

  let toastTimer;
  function toast(msg, kind) {
    const el = $('#toast');
    el.textContent = msg;
    el.className = 'toast' + (kind === 'err' ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 2200);
  }

  function applySettings() {
    const s = S.data.settings;
    document.documentElement.classList.toggle('dark', s.theme === 'dark');
    document.documentElement.lang = L() === 'bn' ? 'bn' : 'en';
    document.body.classList.toggle('no-anim', !s.animations);
  }

  function splashText() {
    $('#splash-name').textContent = t('appName');
    $('#splash-tag').textContent = t('tagline');
  }

  /* ---------- নেভিগেশন ---------- */
  function go(view, params) {
    S.view = view;
    S.params = params || {};
    closeOverlay();
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    applySettings();
    splashText();
    const views = { home: viewHome, details: viewDetails, budget: viewBudget, report: viewReport, family: viewFamily,
      other: viewOther, notifications: viewNotif, settings: viewSettings, form: viewForm, welcome: viewWelcome, auth: viewAuth };
    $('#main').innerHTML = (views[S.view] || viewHome)();
    const page = $('#main').firstElementChild;
    if (page) page.classList.add('page-enter');
    animateVisibleNumbers();
    renderNav();
  }

  function renderNav() {
    const nav = $('#bottomnav');
    const show = !!S.data.session && !['welcome', 'auth'].includes(S.view);
    nav.classList.toggle('hidden', !show);
    if (!show) { nav.innerHTML = ''; return; }
    const n = alerts().length;
    const item = (id, ico, label, badge) =>
      `<button class="${S.view === id ? 'active' : ''}" data-act="go" data-to="${id}"><span>${ico}</span><small>${t(label)}</small>${badge ? `<i class="badge">${dg(badge)}</i>` : ''}</button>`;
    nav.innerHTML = item('home', '🏠', 'navHome') + item('report', '📊', 'navReport')
      + `<button class="fab" data-act="addmenu" aria-label="add">+</button>`
      + item('notifications', '🔔', 'navNotif', n) + item('settings', '👤', 'navProfile');
  }

  function head(title) {
    return `<div class="page-head"><button class="icon-btn" data-act="go" data-to="home">←</button><h2>${title}</h2></div>`;
  }

  /* ---------- ড্যাশবোর্ড ---------- */

  /* ---------- ফর্ম: আয়/ব্যয়/সঞ্চয় ---------- */
  function viewForm() {
    const type = S.params.type || 'income';
    const rec = S.params.id ? U().records.find(r => r.id === S.params.id) : null;
    const v = rec || { amount: '', date: today(), category: '', account: 'cash', member: '', note: '' };
    const cats = U().cats[type];
    const titleKey = { income: 'tAddIncome', expense: 'tAddExpense', savings: 'tAddSavings' }[type];
    return `<section class="page">${head(t(titleKey))}
      <form class="card form" data-form="record">
        <input type="hidden" name="type" value="${type}">
        <input type="hidden" name="id" value="${rec ? rec.id : ''}">
        <label>${t('amount')} *<input name="amount" type="number" min="1" step="any" value="${v.amount}"></label>
        <label>${t('date')}<input name="date" type="date" value="${v.date}"></label>
        <label>${t('category')}<select name="category">${cats.map(c => `<option value="${c}" ${c === v.category ? 'selected' : ''}>${esc(catName(c))}</option>`).join('')}</select></label>
        <label>${t('account')}<select name="account">${U().accounts.map(a => `<option value="${a.id}" ${a.id === v.account ? 'selected' : ''}>${esc(accName(a))}</option>`).join('')}</select></label>
        <label>${t('member')}<select name="member"><option value="">${t('none')}</option>${U().members.map(m => `<option value="${m.id}" ${m.id === v.member ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>
        <label>${t('note')}<input name="note" value="${esc(v.note)}"></label>
        <button class="btn ${type} block" type="submit">${t('save')}</button>
      </form></section>`;
  }

  /* ---------- বিবরণ ---------- */

  /* ---------- রিপোর্ট ---------- */
  function viewReport() {
    const [f, to] = rangeOf(S.period);
    const inc = sumOf('income', f, to), exp = sumOf('expense', f, to), sav = sumOf('savings', f, to);
    const bs = buckets(S.period).map(b => ({ ...b, i: sumOf('income', b.f, b.t), e: sumOf('expense', b.f, b.t) }));
    const max = Math.max(1, ...bs.map(b => Math.max(b.i, b.e)));
    const bars = bs.map(b => `<div class="col-bar" title="${money(b.i)} / ${money(b.e)}">
        <div class="pair"><i class="bi" style="height:${b.i / max * 100}%"></i><i class="be" style="height:${b.e / max * 100}%"></i></div>
        <small>${b.l}</small></div>`).join('');
    const catMap = {};
    recs('expense', f, to).forEach(r => { catMap[r.category] = (catMap[r.category] || 0) + Number(r.amount); });
    const cats = Object.entries(catMap).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
      `<div class="row col"><div class="between"><span>${esc(catName(k))}</span><b>${money(v)}</b></div>
       <div class="bar"><i style="width:${exp ? v / exp * 100 : 0}%"></i></div></div>`).join('');
    const per = ['daily', 'weekly', 'monthly', 'yearly'].map(p =>
      `<button class="chip ${S.period === p ? 'on' : ''}" data-act="period" data-p="${p}">${t(p)}</button>`).join('');
    return `<section class="page">${head(t('report'))}
      <div class="chips">${per}</div>
      <div class="card"><div class="summary">
        <div><small>${t('reportIncome')}</small><b class="amt income">${money(inc)}</b></div>
        <div><small>${t('reportExpense')}</small><b class="amt expense">${money(exp)}</b></div>
        <div><small>${t('reportBalance')}</small><b>${money(inc - exp)}</b></div>
        <div><small>${t('reportSavings')}</small><b class="amt savings">${money(sav)}</b></div>
      </div></div>
      <div class="card"><h4>${t('trend')}</h4>
        <div class="legend"><span><i class="dot g"></i>${t('income')}</span><span><i class="dot r"></i>${t('expense')}</span></div>
        <div class="bars">${bars}</div></div>
      <div class="card"><h4>${t('byCategory')}</h4>${cats || `<p class="empty">${t('emptyList')}</p>`}</div>
    </section>`;
  }

      const q = nextQuote();
      openOverlay(`<div class="wel ${S.data.settings.animations ? '' : 'still'}">
        <div class="coin">🪙</div>

  /* ---------- অ্যাকাউন্ট (Firebase Authentication) ---------- */
  function syncUser(user, name) {
    const nm = name || user.displayName || (user.email || '').split('@')[0];
    let u = S.data.users.find(x => x.id === user.uid);
    if (!u) { u = { id: user.uid, name: nm, email: user.email || '' }; S.data.users.push(u); }
    else { u.email = user.email || u.email; if (name) u.name = name; }
    if (!S.data.store[user.uid]) S.data.store[user.uid] = DB.newBucket();
    S.data.session = { id: user.uid, name: u.name, email: u.email };
    persist();
  }

  function authError(e) {
    const c = (e && e.code) || '';
    if (c === 'auth/email-already-in-use') return t('errEmailUsed');
    if (c === 'auth/weak-password') return t('errPasswordShort');
    if (c === 'auth/invalid-email' || c === 'auth/missing-password') return t('errRequired');
    if (c === 'auth/network-request-failed') return t('errOffline');
    return t('errLogin');
  }

  async function login(v) {
    if (!window.AMAR_AUTH) return toast(t('errOffline'), 'err');
    const email = v('email').toLowerCase(), pw = v('password');
    if (!email || !pw) return toast(t('errRequired'), 'err');
    let user;
    try { user = await window.AMAR_AUTH.signIn(email, pw); }
    catch (e) { return toast(authError(e), 'err'); }
    syncUser(user);
    await welcomeAnim(S.data.session.name);
    go('home');
  }

  async function register(v) {
    if (!window.AMAR_AUTH) return toast(t('errOffline'), 'err');
    const name = v('name'), email = v('email').toLowerCase(), pw = v('password'), c = v('confirmPassword');
    if (!name || !email || !pw) return toast(t('errRequired'), 'err');
    if (pw.length < 6) return toast(t('errPasswordShort'), 'err');
    if (pw !== c) return toast(t('errPasswordMatch'), 'err');
    let user;
    try { user = await window.AMAR_AUTH.signUp(email, pw, name); }
    catch (e) { return toast(authError(e), 'err'); }
    syncUser(user, name);
    await welcomeAnim(name);
    go('home');
  }

  async function googleLogin() {
    if (!window.AMAR_AUTH) return toast(t('errOffline'), 'err');
    let user;
    try { user = await window.AMAR_AUTH.signInGoogle(); }
    catch (e) {
      if (e && e.code === 'auth/popup-closed-by-user') return;
      return toast(authError(e), 'err');
    }
    if (!user) return; // redirect হচ্ছে, ফিরে এলে onAuthStateChanged ধরবে
    syncUser(user);
    await welcomeAnim(S.data.session.name);
    go('home');
  }

  async function logout() {
    try { if (window.AMAR_AUTH) await window.AMAR_AUTH.signOut(); } catch (e) { /* ignore */ }
    S.data.session = null;
    persist();
    go('auth');
  }

  /* ---------- ফর্ম জমা ---------- */
  function saveRecord(v) {
    const amount = Number(v('amount'));
    if (!(amount > 0)) return toast(t('errAmount'), 'err');
    const id = v('id');
    const data = { type: v('type'), amount, date: v('date') || today(), category: v('category'),
      account: v('account'), member: v('member'), note: v('note'), updatedAt: Date.now() };
    if (id) Object.assign(U().records.find(r => r.id === id), data);
    else U().records.push({ id: DB.uid(), createdAt: Date.now(), ...data });
    persist();
    toast(t('saved'));
    go(id ? 'details' : 'home');
  }

  function submitForm(f) {
    const v = n => { const e = f.querySelector(`[name="${n}"]`); return e ? e.value.trim() : ''; };
    const k = f.dataset.form;
    if (k === 'login') return login(v).catch(() => toast(t('errLogin'), 'err'));
    if (k === 'register') return register(v).catch(() => toast(t('errRequired'), 'err'));
    if (k === 'record') return saveRecord(v);

    if (k === 'budget') {
      const amount = Number(v('amount')), from = v('from'), to = v('to');
      if (!v('name') || !(amount > 0) || !from || !to) return toast(t('errRequired'), 'err');
      U().budgets.push({ id: DB.uid(), name: v('name'), amount, from, to, category: v('category') });
    } else if (k === 'member') {
      if (!v('name')) return toast(t('errRequired'), 'err');
      U().members.push({ id: DB.uid(), name: v('name'), relation: v('relation') });
    } else if (k === 'account') {
      if (!v('name')) return toast(t('errRequired'), 'err');
      U().accounts.push({ id: DB.uid(), name: v('name'), opening: Number(v('opening')) || 0 });
    } else if (k === 'loan') {
      const amount = Number(v('amount'));
      if (!v('name') || !(amount > 0)) return toast(t('errRequired'), 'err');
      U().loans.push({ id: DB.uid(), type: v('type'), name: v('name'), amount, date: v('date') || today(), due: v('due'), paid: 0 });
    } else if (k === 'category') {
      const ty = v('type'), name = v('name');
      if (!name) return toast(t('errRequired'), 'err');
      U().cats[ty].push(name);
    } else if (k === 'profile') {
      const name = v('name');
      if (!name) return toast(t('errRequired'), 'err');
      const u = S.data.users.find(x => x.id === S.data.session.id);
      if (u) u.name = name;
      S.data.session.name = name;
      if (window.AMAR_AUTH) window.AMAR_AUTH.updateName(name).catch(() => {});
    } else return;

    persist();
    toast(t('saved'));
    render();
  }

  function payLoan(id, el) {
    const inp = el.parentElement.querySelector('input');
    const amt = Number(inp.value);
    const l = U().loans.find(x => x.id === id);
    if (!l) return;
    const rem = l.amount - l.paid;
    if (!(amt > 0) || amt > rem) return toast(t('errAmount'), 'err');
    l.paid += amt;
    persist();
    toast(t('saved'));
    render();
  }

  function del(kind, id, type, key) {
    if (!confirm(t('confirmDelete'))) return;
    if (kind === 'cats') U().cats[type] = U().cats[type].filter(c => c !== key);
    else U()[kind] = U()[kind].filter(x => x.id !== id);
    persist();
    toast(t('deleted'));
    render();
  }

  /* ---------- ইভেন্ট ---------- */
  function act(a, d, el) {
    switch (a) {
      case 'go':
        if (d.m) S.authMode = d.m;
        if (d.to === 'form') return go('form', { type: d.type, id: d.id });
        return go(d.to, {});
      case 'edit': return go('form', { type: d.type, id: d.id });
      case 'del': return del(d.kind, d.id, d.type, d.key);
      case 'filter': S.filter = d.f; return render();
      case 'period': S.period = d.p; return render();
      case 'payLoan': return payLoan(d.id, el);
      case 'lang': S.data.settings.lang = d.l; persist(); return render();
      case 'theme': S.data.settings.theme = S.data.settings.theme === 'dark' ? 'light' : 'dark'; persist(); return render();
      case 'toggle': S.data.settings[d.k] = !S.data.settings[d.k]; persist(); return render();
      case 'profileToggle': S.data.settings.profileOpen = !S.data.settings.profileOpen; persist(); return render();
      case 'logout': return logout();
      case 'googleLogin': return googleLogin();
      case 'addmenu':
        return openOverlay(`<h3>${t('add')}</h3>
          ${['income', 'expense', 'savings'].map(k => `<button class="btn ${k} block" data-act="go" data-to="form" data-type="${k}">${t(k)}</button>`).join('')}
          <button class="link" data-act="close">${t('cancel')}</button>`);
      case 'close': return closeOverlay();
    }
  }

  document.addEventListener('pointerdown', e => {
    const target = e.target.closest('button');
    if (target && !target.disabled) target.classList.add('tap-press');
  }, { passive: true });
  ['pointerup','pointercancel','pointerleave'].forEach(type => {
    document.addEventListener(type, e => {
      const target = e.target.closest && e.target.closest('button');
      if (target) target.classList.remove('tap-press');
    }, { passive: true });
  });

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    act(el.dataset.act, el.dataset, el);
  });

  document.addEventListener('invalid', e => {
    e.target.classList.add('field-error');
  }, true);
  document.addEventListener('input', e => {
    if (e.target.classList) e.target.classList.remove('field-error');
  });

  document.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    if (!f.dataset || !f.dataset.form || f.dataset.busy === '1') return;
    f.dataset.busy = '1';
    f.classList.add('is-busy');
    const submit = f.querySelector('[type="submit"]');
    if (submit) submit.disabled = true;
    let result;
    try { result = submitForm(f); }
    catch (err) { result = Promise.reject(err); }
    Promise.resolve(result).catch(() => toast(t('errRequired'), 'err')).finally(() => {
      if (!f.isConnected) return;
      f.dataset.busy = '0';
      f.classList.remove('is-busy');
      if (submit) submit.disabled = false;
    });
  });

  /* Firebase Auth প্রস্তুত হওয়ার অপেক্ষা; ৫ সেকেন্ডে না হলে অফলাইন ধরা হবে */
  const AUTH_READY = new Promise(resolve => {
    let first = true;
    const start = () => {
      window.AMAR_AUTH.onChange(user => {
        if (user) syncUser(user);
        else { S.data.session = null; persist(); }
        if (first) { first = false; resolve(); }
      });
    };
    if (window.AMAR_AUTH) start();
    else window.addEventListener('amar-auth-ready', start, { once: true });
    setTimeout(resolve, 5000);
  });

  /* ---------- চালু করা ---------- */
  function boot() {
    applySettings();
    splashText();
    const splashDelay = S.data.settings.animations ? 1050 : 420;
    const minSplash = new Promise(r => setTimeout(r, splashDelay));
    Promise.all([minSplash, AUTH_READY]).then(() => {
      $('#splash').classList.add('gone');
      if (S.data.session) go('home');
      else if (!S.data.users.length) go('welcome');
      else go('auth');
    });
  }

  if (S.data.session && !S.data.store[S.data.session.id]) S.data.session = null;
  CLOUD.init();
  boot();
})();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-analytics.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, GoogleAuthProvider, signInWithPopup, signInWithRedirect } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyD8GzWN0ClEB_hT6PUgyR8aMCz-lsopL5w",
    authDomain: "amarporibar-84bdb.firebaseapp.com",
    projectId: "amarporibar-84bdb",
    storageBucket: "amarporibar-84bdb.firebasestorage.app",
    messagingSenderId: "330585468304",
    appId: "1:330585468304:web:35d95a3aa5f6ce51f45715",
    measurementId: "G-1W4MJ14M4X"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);

  // Analytics শুধু সমর্থিত পরিবেশে (HTTPS/localhost) চালু হয়; না হলে অ্যাপ স্বাভাবিক চলবে
  window.AMAR_FB = { app, analytics: null };
  isSupported()
    .then(ok => { if (ok) window.AMAR_FB.analytics = getAnalytics(app); })
    .catch(err => console.warn('Firebase Analytics চালু হয়নি:', err));

  // Firebase Authentication (ইমেইল/পাসওয়ার্ড)
  const auth = getAuth(app);
  window.AMAR_AUTH = {
    signUp: async (email, pw, name) => {
      const c = await createUserWithEmailAndPassword(auth, email, pw);
      await updateProfile(c.user, { displayName: name });
      return c.user;
    },
    signIn: async (email, pw) => (await signInWithEmailAndPassword(auth, email, pw)).user,
    signOut: () => signOut(auth),
    updateName: name => auth.currentUser ? updateProfile(auth.currentUser, { displayName: name }) : Promise.resolve(),
    signInGoogle: async () => {
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      try {
        return (await signInWithPopup(auth, provider)).user;
      } catch (e) {
        if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment' || e.code === 'auth/cancelled-popup-request')) {
          await signInWithRedirect(auth, provider);
          return null;
        }
        throw e;
      }
    },
    onChange: cb => onAuthStateChanged(auth, cb)
  };
  window.dispatchEvent(new Event('amar-auth-ready'));
</script>
